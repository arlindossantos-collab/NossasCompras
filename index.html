<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossas Compras - Lista do Casal</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .pulse-ring {
      animation: pulse 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex justify-center items-center p-3 sm:p-6">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden border border-slate-200 min-h-[580px]">
    
    <!-- 1. TELA DE LOGIN -->
    <div id="loginScreen" class="flex-1 flex flex-col justify-center items-center p-8 text-center bg-white">
      <div class="w-20 h-20 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center text-3xl mb-6 shadow-inner">
        <i class="fa-solid fa-basket-shopping"></i>
      </div>
      <h1 class="text-2xl font-bold text-slate-800 mb-2">Nossas Compras</h1>
      <p class="text-sm text-slate-500 mb-8 max-w-xs">
        Espaço colaborativo para organizar a lista de compras do casal em tempo real.
      </p>
      
      <button id="btnLogin" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3.5 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-3">
        <i class="fa-brands fa-google text-lg"></i>
        Entrar com Conta Google
      </button>

      <p id="loginStatus" class="text-xs text-slate-400 mt-6">Autenticação necessária para acessar.</p>
    </div>

    <!-- 2. TELA PRINCIPAL -->
    <div id="appScreen" class="hidden flex-1 flex flex-col justify-between">
      
      <!-- Cabeçalho -->
      <div class="bg-indigo-600 p-5 text-white flex justify-between items-center">
        <div>
          <h1 class="text-lg font-bold flex items-center gap-2">
            <i class="fa-solid fa-basket-shopping"></i> Nossas Compras
          </h1>
          <p id="userInfo" class="text-xs text-indigo-200 truncate max-w-[200px]">Carregando usuário...</p>
        </div>
        <button id="btnLogout" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-full transition flex items-center gap-1">
          <i class="fa-solid fa-right-from-bracket"></i> Sair
        </button>
      </div>

      <!-- Abas de Navegação -->
      <div class="flex border-b border-indigo-100 bg-indigo-50">
        <button id="tabDiaria" class="flex-1 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center justify-center gap-1">
          <i class="fa-solid fa-bolt"></i> Lista Diária
        </button>
        <button id="tabFeira" class="flex-1 py-3 text-xs font-bold text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-1">
          <i class="fa-solid fa-cart-flatbed"></i> Feira do Mês
        </button>
      </div>

      <!-- Controle de Grupo/Casal -->
      <div class="bg-indigo-50 p-3 border-b border-indigo-100 flex items-center justify-between gap-2 text-xs">
        <div class="flex-1">
          <label class="font-semibold text-indigo-900 block mb-0.5">CÓDIGO DO GRUPO / CASAL</label>
          <input type="text" id="groupId" value="casal-oficial" class="w-full font-mono px-3 py-1 rounded-lg border border-indigo-200 focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white" placeholder="Ex: casal-123">
        </div>
        <button id="btnConectar" class="mt-3.5 bg-indigo-600 text-white px-3 py-1.5 rounded-lg font-semibold hover:bg-indigo-700">
          Conectar
        </button>
      </div>

      <!-- CONTEÚDO DA ABA 1: LISTA DIÁRIA -->
      <div id="viewDiaria" class="p-4 border-b border-slate-100 bg-slate-50">
        <div class="flex gap-2 mb-2">
          <input type="text" id="itemInput" placeholder="Ex: Sabão em pó, remédio..." class="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
          <button id="btnAddItem" class="bg-indigo-600 text-white px-4 py-3 rounded-xl hover:bg-indigo-700 font-semibold transition">
            <i class="fa-solid fa-plus"></i>
          </button>
        </div>

        <!-- Assistente por Voz -->
        <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
          <div class="flex items-center gap-3">
            <button id="micBtn" class="w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center hover:bg-red-600 transition shadow">
              <i class="fa-solid fa-microphone"></i>
            </button>
            <div>
              <p class="text-xs font-bold text-slate-700">Assistente de Voz</p>
              <p id="voiceStatus" class="text-[11px] text-slate-500">Diga: "Assistente, adicione [item]"</p>
            </div>
          </div>
        </div>
      </div>

      <!-- CONTEÚDO DA ABA 2: FEIRA DO MÊS -->
      <div id="viewFeira" class="hidden p-4 border-b border-slate-100 bg-slate-50 space-y-2">
        <input type="text" id="feiraItemInput" placeholder="Item (ex: Arroz 5kg, Azeite...)" class="w-full px-3 py-2 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        
        <div class="flex gap-2">
          <!-- Campo Onde / Mercado -->
          <select id="feiraMercadoSelect" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white text-slate-700">
            <option value="Assaí">Assaí</option>
            <option value="Atacadão">Atacadão</option>
            <option value="Sams">Sams</option>
            <option value="Carrefour">Carrefour</option>
            <option value="Recibom">Recibom</option>
            <option value="Atacarejo">Atacarejo</option>
            <option value="Rende Mais">Rende Mais</option>
            <option value="Ceasa">Ceasa</option>
            <option value="Verd Frut">Verd Frut</option>
            <option value="Quitanda">Quitanda</option>
            <option value="Outros">Outros</option>
          </select>

          <!-- Campo Bairro -->
          <input type="text" id="feiraBairroInput" placeholder="Bairro (ex: Boa Viagem)" class="flex-1 px-3 py-2 rounded-xl border border-slate-200 text-xs focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        </div>

        <button id="btnAddFeiraItem" class="w-full bg-emerald-600 text-white py-2.5 rounded-xl hover:bg-emerald-700 font-semibold text-xs transition flex items-center justify-center gap-2">
          <i class="fa-solid fa-cart-plus"></i> Adicionar à Feira do Mês
        </button>
      </div>

      <!-- Lista de Itens -->
      <div class="flex-1 p-4 overflow-y-auto max-h-[300px]">
        <ul id="listaCompras" class="space-y-2">
          <li class="text-center py-8 text-slate-400 text-sm">Carregando lista...</li>
        </ul>
      </div>

      <!-- Rodapé -->
      <div class="bg-slate-50 p-3 text-center border-t border-slate-100">
        <p class="text-[11px] text-slate-400">NossasCompras • Módulo Feira do Mês</p>
      </div>

    </div>

  </div>

  <!-- Script Principal com Firebase -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion, arrayRemove, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBEVo6vuUVEMlaqijpP5AkKNZSnK7LXGmE",
      authDomain: "nossascompras-f3b1c.firebaseapp.com",
      projectId: "nossascompras-f3b1c",
      storageBucket: "nossascompras-f3b1c.firebasestorage.app",
      messagingSenderId: "694961166218",
      appId: "1:694961166218:web:a846b1a9b5e81b5d001a73",
      measurementId: "G-1YL3PYB24T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let usuarioAtual = null;
    let unsubscribeSnapshot = null;
    let abaAtiva = "diaria"; // 'diaria' ou 'feira'

    // Troca de Abas
    const tabDiaria = document.getElementById("tabDiaria");
    const tabFeira = document.getElementById("tabFeira");
    const viewDiaria = document.getElementById("viewDiaria");
    const viewFeira = document.getElementById("viewFeira");

    tabDiaria.addEventListener("click", () => {
      abaAtiva = "diaria";
      tabDiaria.className = "flex-1 py-3 text-xs font-bold text-indigo-600 border-b-2 border-indigo-600 flex items-center justify-center gap-1";
      tabFeira.className = "flex-1 py-3 text-xs font-bold text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-1";
      viewDiaria.classList.remove("hidden");
      viewFeira.classList.add("hidden");
      conectarGrupo();
    });

    tabFeira.addEventListener("click", () => {
      abaAtiva = "feira";
      tabFeira.className = "flex-1 py-3 text-xs font-bold text-emerald-600 border-b-2 border-emerald-600 flex items-center justify-center gap-1";
      tabDiaria.className = "flex-1 py-3 text-xs font-bold text-slate-500 hover:text-indigo-600 flex items-center justify-center gap-1";
      viewFeira.classList.remove("hidden");
      viewDiaria.classList.add("hidden");
      conectarGrupo();
    });

    // Login com Google
    document.getElementById("btnLogin").addEventListener("click", () => {
      const provider = new GoogleAuthProvider();
      const statusEl = document.getElementById("loginStatus");
      statusEl.innerText = "Conectando à Conta Google...";

      signInWithPopup(auth, provider).catch((err) => {
        console.error("Erro no login:", err);
        alert("Erro ao autenticar: " + err.message);
        statusEl.innerText = "Erro na autenticação. Tente novamente.";
      });
    });

    // Logout
    document.getElementById("btnLogout").addEventListener("click", () => {
      if (unsubscribeSnapshot) unsubscribeSnapshot();
      signOut(auth);
    });

    // Event Listeners dos botões
    document.getElementById("btnConectar").addEventListener("click", () => conectarGrupo());
    document.getElementById("btnAddItem").addEventListener("click", () => adicionarItemManual());
    document.getElementById("itemInput").addEventListener("keypress", (e) => {
      if (e.key === "Enter") adicionarItemManual();
    });

    document.getElementById("btnAddFeiraItem").addEventListener("click", () => adicionarItemFeira());

    // Monitor de autenticação
    onAuthStateChanged(auth, (user) => {
      const loginScreen = document.getElementById("loginScreen");
      const appScreen = document.getElementById("appScreen");
      const userInfo = document.getElementById("userInfo");

      if (user) {
        usuarioAtual = user;
        userInfo.innerText = user.displayName || user.email;

        loginScreen.classList.add("hidden");
        appScreen.classList.remove("hidden");

        conectarGrupo();
      } else {
        usuarioAtual = null;
        appScreen.classList.add("hidden");
        loginScreen.classList.remove("hidden");
        document.getElementById("loginStatus").innerText = "Autenticação necessária para acessar.";
      }
    });

    // Conectar ao Firestore
    function conectarGrupo() {
      const grupoId = document.getElementById("groupId").value.trim();
      if (!grupoId) return alert("Digite o código do grupo.");

      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const groupRef = doc(db, "grupos_compras", grupoId);

      unsubscribeSnapshot = onSnapshot(groupRef, (docSnap) => {
        if (docSnap.exists()) {
          const dados = docSnap.data();
          const itens = abaAtiva === "diaria" ? (dados.itens || []) : (dados.itensFeira || []);
          renderizarLista(itens, grupoId);
        } else {
          setDoc(groupRef, { itens: [], itensFeira: [] });
          renderizarLista([], grupoId);
        }
      }, (error) => {
        console.error("Erro no Firestore:", error);
      });
    }

    function renderizarLista(itens, grupoId) {
      const listaEl = document.getElementById("listaCompras");
      listaEl.innerHTML = "";

      if (itens.length === 0) {
        listaEl.innerHTML = `<li class="text-center py-8 text-slate-400 text-sm">Nenhum item na ${abaAtiva === 'diaria' ? 'lista diária' : 'feira do mês'}.</li>`;
        return;
      }

      itens.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = `flex flex-col p-3 rounded-xl border transition ${item.comprado ? 'bg-slate-100 border-slate-200 text-slate-400 line-through' : 'bg-white border-slate-200 text-slate-700 shadow-sm'}`;
        
        let metaHtml = "";
        if (abaAtiva === "feira" && (item.mercado || item.bairro)) {
          metaHtml = `
            <div class="text-[11px] text-slate-400 flex items-center gap-2 mt-1">
              ${item.mercado ? `<span class="bg-indigo-50 text-indigo-700 px-2 py-0.5 rounded font-medium"><i class="fa-solid fa-store text-[10px]"></i> ${item.mercado}</span>` : ''}
              ${item.bairro ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded"><i class="fa-solid fa-location-dot text-[10px]"></i> ${item.bairro}</span>` : ''}
            </div>
          `;
        }

        li.innerHTML = `
          <div class="flex items-center justify-between">
            <span class="item-text flex-1 cursor-pointer font-medium text-sm">
              ${item.nome}
            </span>
            <button class="btn-del text-slate-400 hover:text-red-500 p-1 text-xs">
              <i class="fa-solid fa-trash"></i>
            </button>
          </div>
          ${metaHtml}
        `;

        li.querySelector(".item-text").addEventListener("click", () => {
          toggleItemComprado(grupoId, index);
        });

        li.querySelector(".btn-del").addEventListener("click", () => {
          removerItem(grupoId, index);
        });

        listaEl.appendChild(li);
      });
    }

    // Adicionar Item Diário
    async function adicionarItemBD(nomeItem) {
      if (!nomeItem || !usuarioAtual) return;
      const grupoId = document.getElementById("groupId").value.trim();
      const groupRef = doc(db, "grupos_compras", grupoId);

      try {
        await updateDoc(groupRef, {
          itens: arrayUnion({ nome: nomeItem, comprado: false, criadoEm: new Date().toISOString(), adicionadoPor: usuarioAtual.email })
        });
      } catch (err) {
        await setDoc(groupRef, {
          itens: [{ nome: nomeItem, comprado: false, criadoEm: new Date().toISOString(), adicionadoPor: usuarioAtual.email }],
          itensFeira: []
        }, { merge: true });
      }
    }

    // Adicionar Item da Feira do Mês
    async function adicionarItemFeira() {
      const input = document.getElementById("feiraItemInput");
      const mercadoSelect = document.getElementById("feiraMercadoSelect");
      const bairroInput = document.getElementById("feiraBairroInput");

      const nomeItem = input.value.trim();
      if (!nomeItem || !usuarioAtual) return;

      const grupoId = document.getElementById("groupId").value.trim();
      const groupRef = doc(db, "grupos_compras", grupoId);

      const novoItem = {
        nome: nomeItem,
        mercado: mercadoSelect.value,
        bairro: bairroInput.value.trim(),
        comprado: false,
        criadoEm: new Date().toISOString(),
        adicionadoPor: usuarioAtual.email
      };

      try {
        await updateDoc(groupRef, {
          itensFeira: arrayUnion(novoItem)
        });
      } catch (err) {
        await setDoc(groupRef, {
          itens: [],
          itensFeira: [novoItem]
        }, { merge: true });
      }

      input.value = "";
      bairroInput.value = "";
    }

    function adicionarItemManual() {
      const input = document.getElementById("itemInput");
      adicionarItemBD(input.value.trim());
      input.value = "";
    }

    async function toggleItemComprado(grupoId, index) {
      const groupRef = doc(db, "grupos_compras", grupoId);
      const docSnap = await getDoc(groupRef);
      if (docSnap.exists()) {
        const campo = abaAtiva === "diaria" ? "itens" : "itensFeira";
        const itens = [...(docSnap.data()[campo] || [])];
        if (itens[index]) {
          itens[index].comprado = !itens[index].comprado;
          await updateDoc(groupRef, { [campo]: itens });
        }
      }
    }

    async function removerItem(grupoId, index) {
      const groupRef = doc(db, "grupos_compras", grupoId);
      const docSnap = await getDoc(groupRef);
      if (docSnap.exists()) {
        const campo = abaAtiva === "diaria" ? "itens" : "itensFeira";
        const itens = docSnap.data()[campo] || [];
        const itemParaRemover = itens[index];
        if (itemParaRemover) {
          await updateDoc(groupRef, { [campo]: arrayRemove(itemParaRemover) });
        }
      }
    }

    // Assistente de Voz
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let gravando = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        gravando = true;
        document.getElementById("micBtn").classList.add("pulse-ring");
        document.getElementById("voiceStatus").innerText = "Ouvindo... Fale agora!";
      };

      recognition.onend = () => {
        gravando = false;
        document.getElementById("micBtn").classList.remove("pulse-ring");
        document.getElementById("voiceStatus").innerText = 'Diga: "Assistente, adicione [item]"';
      };

      recognition.onresult = (event) => {
        const textoFalar = event.results[0][0].transcript.toLowerCase();
        let itemExtraido = "";

        if (textoFalar.includes("adicione") || textoFalar.includes("adicionar")) {
          const partes = textoFalar.split(/adicione|adicionar/);
          if (partes.length > 1) {
            itemExtraido = partes[1]
              .replace("na minha lista de compras", "")
              .replace("na lista de compras", "")
              .replace("na minha lista", "")
              .replace("na lista", "")
              .trim();
          }
        } else {
          itemExtraido = textoFalar.replace("assistente", "").trim();
        }

        if (itemExtraido) {
          itemExtraido = itemExtraido.replace(/^(o|a|os|as|um|uma)\s+/, "");
          itemExtraido = itemExtraido.charAt(0).toUpperCase() + itemExtraido.slice(1);
          
          adicionarItemBD(itemExtraido);
          document.getElementById("voiceStatus").innerText = `Adicionado: "${itemExtraido}"`;
        }
      };
    } else {
      document.getElementById("voiceStatus").innerText = "Navegador sem suporte a comando de voz.";
    }

    document.getElementById("micBtn").addEventListener("click", () => {
      if (!recognition) return alert("Navegador sem suporte à Web Speech API. Use o Google Chrome ou Safari.");
      if (gravando) {
        recognition.stop();
      } else {
        recognition.start();
      }
    });
  </script>
</body>
</html>
