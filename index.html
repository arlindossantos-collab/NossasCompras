<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nossas Compras - Lista do Casal</title>
  <!-- Tailwind CSS CDN para Interface Moderna -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome para Ícones -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .pulse-ring {
      animation: pulse 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
    }
    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
    }
  </style>
</head>
<body class="bg-slate-100 min-h-screen text-slate-800 flex justify-center p-3 sm:p-6">

  <div class="w-full max-w-md bg-white rounded-3xl shadow-2xl flex flex-col justify-between overflow-hidden border border-slate-200">
    
    <!-- Cabeçalho -->
    <div class="bg-indigo-600 p-6 text-white">
      <div class="flex justify-between items-center mb-2">
        <h1 class="text-2xl font-bold flex items-center gap-2">
          <i class="fa-solid fa-basket-shopping"></i> Nossas Compras
        </h1>
        <button id="authBtn" onclick="toggleAuth()" class="text-xs bg-indigo-700 hover:bg-indigo-800 px-3 py-1.5 rounded-full transition">
          Entrar com Google
        </button>
      </div>
      <p id="userInfo" class="text-xs text-indigo-200">Faça login para sincronizar com seu casal.</p>
    </div>

    <!-- Controle de Grupo -->
    <div class="bg-indigo-50 p-4 border-b border-indigo-100 flex items-center justify-between gap-2">
      <div class="flex-1">
        <label class="text-xs font-semibold text-indigo-900 block mb-1">CÓDIGO DO GRUPO / CASAL</label>
        <input type="text" id="groupId" value="casal-oficial" class="w-full text-sm font-mono px-3 py-1.5 rounded-lg border border-indigo-200 focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="Digite o ID do grupo">
      </div>
      <button onclick="conectarGrupo()" class="mt-4 bg-indigo-600 text-white text-xs px-3 py-2 rounded-lg font-semibold hover:bg-indigo-700">
        Conectar
      </button>
    </div>

    <!-- Campo de Inserção e Comando de Voz -->
    <div class="p-4 border-b border-slate-100 bg-slate-50">
      <div class="flex gap-2 mb-2">
        <input type="text" id="itemInput" placeholder="Ex: Sabão em pó, remédio..." class="flex-1 px-4 py-3 rounded-xl border border-slate-200 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
        <button onclick="adicionarItemManual()" class="bg-indigo-600 text-white px-4 py-3 rounded-xl hover:bg-indigo-700 font-semibold transition">
          <i class="fa-solid fa-plus"></i>
        </button>
      </div>

      <!-- Botão do Assistente por Voz -->
      <div class="flex items-center justify-between bg-white p-3 rounded-xl border border-slate-200 shadow-sm">
        <div class="flex items-center gap-3">
          <button id="micBtn" onclick="toggleVoz()" class="w-10 h-10 rounded-full bg-red-500 text-white flex items-center justify-center hover:bg-red-600 transition shadow">
            <i class="fa-solid fa-microphone"></i>
          </button>
          <div>
            <p class="text-xs font-bold text-slate-700">Assistente de Voz</p>
            <p id="voiceStatus" class="text-[11px] text-slate-500">Diga: "Assistente, adicione [item]"</p>
          </div>
        </div>
      </div>
    </div>

    <!-- Lista de Itens (Scroll) -->
    <div class="flex-1 p-4 overflow-y-auto max-h-[400px]">
      <ul id="listaCompras" class="space-y-2">
        <li class="text-center py-8 text-slate-400 text-sm">Conecte-se para carregar a lista...</li>
      </ul>
    </div>

    <!-- Rodapé informativo -->
    <div class="bg-slate-50 p-3 text-center border-t border-slate-100">
      <p class="text-[11px] text-slate-400">NossasCompras • Projeto Firebase: nossascompras-f3b1c</p>
    </div>

  </div>

  <!-- Módulos do Firebase (v10 SDK) -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, onSnapshot, setDoc, updateDoc, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    // Suas credenciais oficiais inseridas com sucesso
    const firebaseConfig = {
      apiKey: "AIzaSyBEVo6vuUVEMlaqijpP5AkKNZSnK7LXGmE",
      authDomain: "nossascompras-f3b1c.firebaseapp.com",
      projectId: "nossascompras-f3b1c",
      storageBucket: "nossascompras-f3b1c.firebasestorage.app",
      messagingSenderId: "694961166218",
      appId: "1:694961166218:web:a846b1a9b5e81b5d001a73",
      measurementId: "G-1YL3PYB24T"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);
    let usuarioAtual = null;
    let unsubscribeSnapshot = null;

    // Autenticação com Google
    window.toggleAuth = () => {
      if (usuarioAtual) {
        signOut(auth);
      } else {
        const provider = new GoogleAuthProvider();
        signInWithPopup(auth, provider).catch(err => alert("Erro ao autenticar: " + err.message));
      }
    };

    onAuthStateChanged(auth, (user) => {
      usuarioAtual = user;
      const authBtn = document.getElementById("authBtn");
      const userInfo = document.getElementById("userInfo");

      if (user) {
        authBtn.innerText = "Sair";
        userInfo.innerText = `Logado como: ${user.displayName || user.email}`;
        conectarGrupo();
      } else {
        authBtn.innerText = "Entrar com Google";
        userInfo.innerText = "Faça login para sincronizar com seu casal.";
        document.getElementById("listaCompras").innerHTML = `<li class="text-center py-8 text-slate-400 text-sm">Faça login com sua conta do Google.</li>`;
      }
    });

    // Sincronização em tempo real por grupo
    window.conectarGrupo = () => {
      const grupoId = document.getElementById("groupId").value.trim();
      if (!grupoId) return alert("Digite o código do grupo.");

      if (unsubscribeSnapshot) unsubscribeSnapshot();

      const groupRef = doc(db, "grupos_compras", grupoId);

      unsubscribeSnapshot = onSnapshot(groupRef, (docSnap) => {
        if (docSnap.exists()) {
          renderizarLista(docSnap.data().itens || [], grupoId);
        } else {
          setDoc(groupRef, { itens: [] });
          renderizarLista([], grupoId);
        }
      });
    };

    function renderizarLista(itens, grupoId) {
      const listaEl = document.getElementById("listaCompras");
      listaEl.innerHTML = "";

      if (itens.length === 0) {
        listaEl.innerHTML = `<li class="text-center py-8 text-slate-400 text-sm">A lista está vazia! Adicione itens acima ou use a voz.</li>`;
        return;
      }

      itens.forEach((item, index) => {
        const li = document.createElement("li");
        li.className = `flex items-center justify-between p-3 rounded-xl border transition ${item.comprado ? 'bg-slate-100 border-slate-200 text-slate-400 line-through' : 'bg-white border-slate-200 text-slate-700 shadow-sm'}`;
        
        li.innerHTML = `
          <span onclick="toggleItemComprado('${grupoId}', ${index})" class="flex-1 cursor-pointer font-medium text-sm">
            ${item.nome}
          </span>
          <button onclick="removerItem('${grupoId}', ${index})" class="text-slate-400 hover:text-red-500 p-1 text-xs">
            <i class="fa-solid fa-trash"></i>
          </button>
        `;
        listaEl.appendChild(li);
      });
    }

    // Operações no Firestore
    window.adicionarItemBD = async (nomeItem) => {
      if (!nomeItem) return;
      const grupoId = document.getElementById("groupId").value.trim();
      const groupRef = doc(db, "grupos_compras", grupoId);

      try {
        await updateDoc(groupRef, {
          itens: arrayUnion({ nome: nomeItem, comprado: false, criadoEm: new Date().toISOString() })
        });
      } catch (err) {
        await setDoc(groupRef, {
          itens: [{ nome: nomeItem, comprado: false, criadoEm: new Date().toISOString() }]
        }, { merge: true });
      }
    };

    window.adicionarItemManual = () => {
      const input = document.getElementById("itemInput");
      adicionarItemBD(input.value.trim());
      input.value = "";
    };

    window.toggleItemComprado = async (grupoId, index) => {
      const groupRef = doc(db, "grupos_compras", grupoId);
      onSnapshot(groupRef, async (docSnap) => {
        if (docSnap.exists()) {
          const itens = [...docSnap.data().itens];
          if (itens[index]) {
            itens[index].comprado = !itens[index].comprado;
            await updateDoc(groupRef, { itens });
          }
        }
      }, { oneshot: true });
    };

    window.removerItem = async (grupoId, index) => {
      const groupRef = doc(db, "grupos_compras", grupoId);
      onSnapshot(groupRef, async (docSnap) => {
        if (docSnap.exists()) {
          const itens = docSnap.data().itens || [];
          const itemParaRemover = itens[index];
          if (itemParaRemover) {
            await updateDoc(groupRef, { itens: arrayRemove(itemParaRemover) });
          }
        }
      }, { oneshot: true });
    };

    // Reconhecimento de voz (Web Speech API)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let gravando = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.lang = 'pt-BR';
      recognition.continuous = false;
      recognition.interimResults = false;

      recognition.onstart = () => {
        gravando = true;
        document.getElementById("micBtn").classList.add("pulse-ring");
        document.getElementById("voiceStatus").innerText = "Ouvindo... Fale agora!";
      };

      recognition.onend = () => {
        gravando = false;
        document.getElementById("micBtn").classList.remove("pulse-ring");
        document.getElementById("voiceStatus").innerText = 'Diga: "Assistente, adicione [item]"';
      };

      recognition.onresult = (event) => {
        const textoFalar = event.results[0][0].transcript.toLowerCase();

        let itemExtraido = "";

        if (textoFalar.includes("adicione") || textoFalar.includes("adicionar")) {
          const partes = textoFalar.split(/adicione|adicionar/);
          if (partes.length > 1) {
            itemExtraido = partes[1]
              .replace("na minha lista de compras", "")
              .replace("na lista de compras", "")
              .replace("na minha lista", "")
              .replace("na lista", "")
              .trim();
          }
        } else {
          itemExtraido = textoFalar.replace("assistente", "").trim();
        }

        if (itemExtraido) {
          itemExtraido = itemExtraido.replace(/^(o|a|os|as|um|uma)\s+/, "");
          itemExtraido = itemExtraido.charAt(0).toUpperCase() + itemExtraido.slice(1);
          
          adicionarItemBD(itemExtraido);
          document.getElementById("voiceStatus").innerText = `Adicionado: "${itemExtraido}"`;
        }
      };
    } else {
      document.getElementById("voiceStatus").innerText = "Navegador sem suporte a comando de voz.";
    }

    window.toggleVoz = () => {
      if (!recognition) return alert("Navegador sem suporte à Web Speech API. Use o Google Chrome ou Safari.");
      if (gravando) {
        recognition.stop();
      } else {
        recognition.start();
      }
    };
  </script>
</body>
</html>
